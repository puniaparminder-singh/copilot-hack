name: Sci-fi channel pipeline

on:
  schedule:
    - cron: "17 6 * * 0,3"   # make a video Sun + Wed 06:17 UTC (uploads are scheduled via publishAt)
    - cron: "41 9 * * *"     # daily growth job: comments + analytics insights
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic for this video"
        required: false

concurrency: scifi-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
      CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
      CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
    defaults:
      run:
        working-directory: scifi-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt

      # history.json, insights.json and OAuth tokens persist between runs via the cache.
      - uses: actions/cache@v4
        with:
          path: scifi-pipeline/output/state
          key: scifi-state-${{ github.run_id }}
          restore-keys: scifi-state-
      - name: Restore state and secrets
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CONFIG_YAML: ${{ secrets.SCIFI_CONFIG_YAML }}
        run: |
          mkdir -p output/state
          cp -n output/state/* output/ 2>/dev/null || true
          cp -n output/state/.[!.]* output/ 2>/dev/null || true
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          [ -f output/.youtube_token.json ] || echo "$YOUTUBE_TOKEN_JSON" > output/.youtube_token.json
          if [ -n "$CONFIG_YAML" ]; then echo "$CONFIG_YAML" > config.yaml; fi

      - name: Make and upload video
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * 0,3'
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: python run.py make ${TOPIC:+--topic "$TOPIC"}

      - name: Growth job
        if: github.event.schedule == '41 9 * * *'
        run: python run.py growth

      - name: Save state
        if: always()
        run: cp output/*.json output/.*.json output/state/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-run
          path: |
            scifi-pipeline/output/*/final/
            scifi-pipeline/output/*/fixes.md
            scifi-pipeline/output/*/script.json
          retention-days: 14
